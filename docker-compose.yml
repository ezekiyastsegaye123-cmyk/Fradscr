services:
  # ----------------------------------------------------------------------------
  # 1. Streamlit Application Service
  # ----------------------------------------------------------------------------
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fradscr-streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
