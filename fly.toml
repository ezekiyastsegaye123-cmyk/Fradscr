# fly.toml app configuration file for FRADSCR
app = "fradscr-drought-predictor"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8501"
  CALIBRATION_TEMPERATURE = "0.35"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "25s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/_stcore/health"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
